# /etc/nginx/sites-available/niulai
# Replace niulai.example.com with your real domain.

server {
    listen 80;
    server_name niulai.example.com www.niulai.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name niulai.example.com www.niulai.example.com;

    ssl_certificate /etc/letsencrypt/live/niulai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niulai.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/niulai_access.log;
    error_log /var/log/nginx/niulai_error.log;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3050;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
